<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Stage — lit glass</title>
<link rel="stylesheet" href="glass.css">
<style>
body{background-color:#100d14}
#caustics{position:absolute;inset:0;width:390px;height:844px;pointer-events:none;mix-blend-mode:screen;z-index:1}
.window{position:absolute;left:50%;top:58px;margin-left:-118px;width:236px;height:330px;z-index:2}
.window canvas,.window svg.win{position:absolute;inset:0;width:236px;height:330px;touch-action:none;cursor:grab}
.rank{position:absolute;right:-22px;bottom:34px;width:58px;height:58px;z-index:3}
.plaque{position:absolute;left:50%;top:400px;transform:translateX(-50%);text-align:center;width:300px;z-index:2}
.plaque .disp{font-size:34px;line-height:1}
.plaque p{font:italic 400 15px/1.45 "Spectral",serif;color:var(--bone-dim);margin-top:4px}
.hint-light{font:800 12px/1 "Alegreya Sans SC",sans-serif;letter-spacing:.1em;color:rgba(220,184,116,.75);margin-top:8px}
.deckwrap{position:absolute;left:18px;right:18px;top:488px;height:176px;z-index:2;perspective:900px}
/* Results as dark glass plaques set in lead */
.gslip{position:absolute;left:0;right:0;top:0;background:rgba(20,15,28,.7);-webkit-backdrop-filter:blur(3px) saturate(1.3);backdrop-filter:blur(3px) saturate(1.3);border:3px solid var(--night);border-radius:7px;
 box-shadow:inset 0 0 0 1px rgba(220,184,116,.55),inset 0 1px 0 rgba(255,255,255,.16),0 14px 26px rgba(0,0,0,.6);padding:15px 16px 13px;overflow:hidden;cursor:pointer;touch-action:none}
.gslip::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.07) 46%,rgba(255,255,255,.02) 52%,transparent 60%);background-size:240% 100%;animation:sheen 7s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.gslip .row{display:flex;gap:14px;align-items:center;position:relative}
.gslip .when{font:800 12px/1 "Alegreya Sans SC",sans-serif;letter-spacing:.1em;color:var(--brass-l)}
.gslip .who{font:700 23px/1.12 "Grenze Gotisch",serif;margin-top:6px}
.gslip .what{font:italic 400 15px/1.45 "Spectral",serif;color:var(--bone-dim);margin-top:6px;position:relative}
.gslip .foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:9px;border-top:1px solid rgba(184,146,74,.3);position:relative}
.gslip .pts{font:700 26px/1 "Grenze Gotisch",serif;color:var(--amber-l)}
.gslip .hint{font:800 12px/1 "Alegreya Sans SC",sans-serif;letter-spacing:.08em;color:var(--brass-l)}
.gslip.shake{animation:shk .28s linear}
@keyframes shk{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}}
.cracks{position:absolute;inset:0;pointer-events:none;overflow:visible}
.cracks path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.shard{position:absolute;left:0;right:0;top:0;pointer-events:none;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:rgba(26,19,34,.94)!important;will-change:transform}
.shard::after{content:"";position:absolute;inset:0;background:var(--sheen);pointer-events:none}
.ledge{position:absolute;left:6px;right:6px;height:9px;background:rgba(20,15,28,.85);border:2px solid var(--night);border-top:0;border-radius:0 0 6px 6px;box-shadow:inset 0 -1px 0 rgba(220,184,116,.35)}
.empty{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 6px}
.empty .t{font:700 23px/1.15 "Grenze Gotisch",serif}
.empty p{font:italic 400 15px/1.45 "Spectral",serif;color:var(--bone-dim);margin-top:4px}
.empty .pane-btn{margin-left:auto;flex:none}
.cta{position:absolute;left:18px;right:18px;bottom:92px;z-index:2}
.cta .pane-btn{width:100%;justify-content:space-between}
.hud{z-index:4}
.purse .unit{font:800 12px/1 "Alegreya Sans SC",sans-serif;letter-spacing:.08em;color:var(--brass-l);margin-left:2px}
.plaque .aspect{font-style:normal;font-weight:600;color:var(--bone)}
.gslip .pts small{font:800 12px/1 "Alegreya Sans SC",sans-serif;letter-spacing:.08em;color:var(--brass-l)}
</style></head>
<body class="stonework">
<canvas id="caustics"></canvas>
<div class="hud"><div class="purse"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L15 8 L8 15 L1 8Z" fill="#f2c25a" stroke="#0b0a10" stroke-width="1.5"/></svg><b id="gilt">1,240</b><span class="unit">Ash</span></div><div class="purse">Resonance <b id="lv">7</b></div></div>
<div class="window" id="win"><canvas id="glass"></canvas></div>
<div class="plaque"><div class="disp">Vesper</div><p>Wears the mask of <b class="aspect">Echo</b>. Answers as it was answered.</p><div class="hint-light">Drag across the window to move the light</div></div>
<div class="deckwrap"><div class="deck" id="deck"></div></div>
<div class="cta"><div class="pane-btn" id="lay"><span>Attune for tonight</span><small>Gathering · 20:00</small></div></div>
<div id="tabs"></div>
<script src="glass.js"></script>
<script src="glassgl.js"></script>
<script>
const $=s=>document.querySelector(s),R=G.READINGS,reduce=G.reduce;
$("#tabs").outerHTML=G.tabbar("vesper");
const seal=`<svg class="rank" viewBox="0 0 58 58"><circle cx="29" cy="29" r="27" fill="#a3172f" stroke="#0b0a10" stroke-width="4"/><circle cx="29" cy="29" r="21" fill="none" stroke="#dcb874" stroke-width="1.5"/><text x="29" y="38" text-anchor="middle" font-family="Grenze Gotisch" font-weight="700" font-size="22" fill="#efe4cc">VII</text></svg>`;
$("#win").insertAdjacentHTML("beforeend",seal);
let lit=null;
GL.mount({winCanvas:$("#glass"),causticCanvas:$("#caustics"),preset:new URLSearchParams(location.search).get("preset")||"locked"}).then(api=>{lit=api;if(api&&new URLSearchParams(location.search).has("tune"))tuner(api);if(!api){$("#glass").remove();$("#win").insertAdjacentHTML("afterbegin",G.windowSVG({theme:"vesper",seed:13,width:236}))}})
 .catch(err=>{console.error(err);$("#glass").remove();$("#win").insertAdjacentHTML("afterbegin",G.windowSVG({theme:"vesper",seed:13,width:236}))});

/* ---------- Glass plaques that crack, then shatter ---------- */
function fracture(P,w,h){const n=9,rays=[];for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2+(Math.random()-.5)*.45;rays.push({a,rA:22+Math.random()*16,rB:62+Math.random()*30,rC:120+Math.random()*50})}
 const at=(ray,r)=>[P[0]+Math.cos(ray.a)*r,P[1]+Math.sin(ray.a)*r];return {rays,at}}
function crack(slip,F){let svg=slip.querySelector(".cracks");if(!svg){svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","cracks");slip.appendChild(svg)}
 const {rays,at}=F,d=[];
 rays.forEach(r=>{const far=at(r,700),mid=at(r,r.rB),j=[mid[0]+(Math.random()-.5)*6,mid[1]+(Math.random()-.5)*6];d.push(`M${at(r,4).join(" ")}L${at(r,r.rA).join(" ")}L${j.join(" ")}L${at(r,r.rC).join(" ")}L${far.join(" ")}`)});
 const ring=k=>"M"+rays.map(r=>at(r,r[k]).join(" ")).join("L")+"Z";
 d.push(ring("rA"),ring("rB"));
 svg.innerHTML=d.map(p=>`<path d="${p}" stroke="rgba(0,0,0,.55)" stroke-width="2.2" transform="translate(.8 .8)"/><path d="${p}" stroke="rgba(255,248,230,.8)" stroke-width="1.1"/>`).join("");
 if(!reduce)svg.querySelectorAll("path").forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:200,easing:"cubic-bezier(.2,.9,.3,1)",fill:"forwards"})});
 slip.classList.remove("shake");void slip.offsetWidth;slip.classList.add("shake")}
function shards(F){const {rays,at}=F,out=[],n=rays.length;
 for(let i=0;i<n;i++){const a=rays[i],b=rays[(i+1)%n];
  out.push([F.P,at(a,a.rA),at(b,b.rA)],[at(a,a.rA),at(a,a.rB),at(b,b.rB),at(b,b.rA)],[at(a,a.rB),at(a,a.rC),at(b,b.rC),at(b,b.rB)],[at(a,a.rC),at(a,900),at(b,900),at(b,b.rC)])}
 return out}
function shatter(slip,F,done){const parent=slip.parentElement,w=slip.offsetWidth,h=slip.offsetHeight;
 const pieces=shards(F);slip.style.visibility="hidden";done();
 pieces.forEach((poly,k)=>{const c=slip.cloneNode(true);c.classList.add("shard");c.classList.remove("shake");c.style.visibility="visible";c.style.top=slip.offsetTop+"px";
  c.style.clipPath=`polygon(${poly.map(p=>p[0].toFixed(1)+"px "+p[1].toFixed(1)+"px").join(",")})`;
  const ang=Math.round(Math.random()*180);c.style.setProperty("--sheen",`linear-gradient(${ang}deg,rgba(255,255,255,0) 35%,rgba(255,255,255,${(.08+Math.random()*.14).toFixed(2)}) 50%,rgba(255,255,255,0) 65%)`);
  parent.appendChild(c);
  const cx=Math.min(w,Math.max(0,poly.reduce((s,p)=>s+p[0],0)/poly.length)),cy=Math.min(h,Math.max(0,poly.reduce((s,p)=>s+p[1],0)/poly.length));
  const dx=cx-F.P[0],dy=cy-F.P[1],dl=Math.hypot(dx,dy)||1,push=Math.max(.25,1-dl/260),vx=dx/dl*(30+Math.random()*50)*push,vy=dy/dl*(20+Math.random()*30)*push;
  const rz=(Math.random()-.5)*160,rx=(Math.random()-.5)*120,ry=(Math.random()-.5)*120,tz=40+Math.random()*80,o=`${cx}px ${cy}px`;c.style.transformOrigin=o;
  c.animate([{transform:"none",opacity:1},{transform:`translate3d(${vx*.6}px,${vy*.6-26*push}px,${tz*.5}px) rotate(${rz*.25}deg)`,opacity:1,offset:.22},
   {transform:`translate3d(${vx*1.4}px,${560}px,${tz}px) rotate(${rz}deg) rotateX(${rx}deg) rotateY(${ry}deg)`,opacity:0}],
   {duration:reduce?1:950+Math.random()*350,easing:"cubic-bezier(.35,.0,.75,.55)",delay:reduce?0:Math.min(dl,240)*.35}).onfinish=()=>c.remove()});
}
function shatterable(slip,onDone){let stage=0,F=null,hold=null,gone=false;
 slip.addEventListener("pointerdown",e=>{if(gone)return;const r=slip.getBoundingClientRect(),P=[e.clientX-r.left,e.clientY-r.top];
  if(stage===0){F=fracture(P,r.width,r.height);F.P=P;crack(slip,F);stage=1;hold=setTimeout(()=>{gone=true;shatter(slip,F,onDone)},520)}
  else{gone=true;clearTimeout(hold);shatter(slip,F,onDone)}});
 ["pointerup","pointercancel","pointerleave"].forEach(n=>slip.addEventListener(n,()=>clearTimeout(hold)))}

let done=0;
function deck(){const d=$("#deck");[...d.querySelectorAll(".gslip:not(.shard),.ledge,.empty")].forEach(x=>x.remove());const left=R.length-done;
 for(let e=Math.min(3,left-1)-1;e>=0;e--){const x=document.createElement("div");x.className="ledge";x.style.top=170+e*5+"px";d.prepend(x)}
 if(left===0){d.insertAdjacentHTML("beforeend",`<div class="empty"><svg width="34" height="70" viewBox="0 0 34 70"><rect x="10" y="26" width="14" height="40" rx="2" fill="#efe4cc" stroke="#0b0a10" stroke-width="2"/><path d="M17 4 C24 14 23 22 17 24 C11 22 10 14 17 4Z" fill="#f2c25a" stroke="#0b0a10" stroke-width="2"/></svg><div><div class="t">Vesper kept vigil 7h 40m</div><p>320 Resonance and 85 Ash wait to be claimed.</p></div><div class="pane-btn" id="gather"><span>Claim</span></div></div>`);
  G.press(d);$("#gather").addEventListener("click",e=>{const b=e.currentTarget;G.motes(b,$("#gilt"),8);setTimeout(()=>{G.countUp($("#gilt"),1240,1325);$("#lv").textContent="8";$("#lv").classList.add("bump")},reduce?0:850);b.classList.add("done");b.querySelector("span").textContent="Claimed";lit&&lit.swell()},{once:true});return}
 const r=R[done],s=document.createElement("div");s.className="gslip";
 s.innerHTML=`<div class="row">${G.medallion(r.hero,r.them)}<div><div class="when">${r.day}</div><div class="who">Vesper met ${r.opp}</div></div></div><div class="what">${r.what}</div><div class="foot"><span class="pts">+${r.pts} <small>Light</small></span><span class="hint">Tap to crack · ${left} left</span></div>`;
 d.appendChild(s);if(done&&!reduce)s.animate([{opacity:0},{opacity:1}],{duration:300});
 shatterable(s,()=>{done++;deck()})}
$("#lay").addEventListener("click",e=>{const b=e.currentTarget;b.classList.add("done");b.querySelector("span").textContent="Attuned";b.querySelector("small").textContent="Sealed for 20:00";lit&&lit.swell()});
deck();G.press();G.tabs();
</script>
</body></html>
<script>
/* Review-only: #shatter-test fires a crack then a shatter so a headless capture can see shards mid-flight. */
if(location.hash==="#shatter-test")setTimeout(()=>{const s=document.querySelector(".gslip"),r=s.getBoundingClientRect(),o={clientX:r.left+r.width*.62,clientY:r.top+r.height*.45,pointerId:1,bubbles:true};
 s.dispatchEvent(new PointerEvent("pointerdown",o));s.dispatchEvent(new PointerEvent("pointerup",o));setTimeout(()=>s.dispatchEvent(new PointerEvent("pointerdown",o)),250)},400);
</script>
<style>
/* Design-review tuner (only with ?tune). Sits beside the phone column on a desktop screen. */
#tuner{position:fixed;top:16px;left:calc(50% + 215px);width:280px;max-height:calc(100vh - 32px);overflow:auto;background:#f4f1ea;color:#1d1b19;border-radius:12px;padding:14px 16px;font:500 13px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50;user-select:text;touch-action:auto}
#tuner h3{font:700 14px/1.2 system-ui,sans-serif;margin-bottom:8px}
#tuner .presets{display:flex;gap:6px;margin-bottom:10px}
#tuner button{font:600 12px/1 system-ui,sans-serif;padding:7px 9px;border-radius:7px;border:1px solid #b9b2a6;background:#fff;cursor:pointer}
#tuner button.on{background:#1d1b19;color:#f4f1ea;border-color:#1d1b19}
#tuner label{display:grid;grid-template-columns:1fr 44px;gap:2px 8px;margin:8px 0}
#tuner label span{font-weight:600}
#tuner label small{grid-column:1/-1;color:#5c564d;font-size:12px}
#tuner output{text-align:right;font-variant-numeric:tabular-nums}
#tuner input{grid-column:1/-1;width:100%;accent-color:#7a3b2a}
@media (max-width:900px){#tuner{left:auto;right:8px;top:auto;bottom:84px;width:260px;max-height:45vh}}
</style>
<script>
const KNOBS=[
 ["hot","Backlight hotspot",0,2,.01,"How much a single lamp behind the window shows. Lower = evenly lit glass."],
 ["amb","Ambient light",0,3,.01,"Even light through every pane."],
 ["moon","Moon disc",0,2,.01,"A visible moon behind the glass."],
 ["leak","See-through",0,1.5,.01,"How much of the sky shows through thin, pale glass."],
 ["rim","Edge rim",0,.6,.01,"Bright line inside each lead. Causes the 'puffy cushion' look."],
 ["grime","Grime at lead",0,.8,.01,"Darkening where glass meets lead."],
 ["bloom","Bloom",0,1,.01,"Bright panes bleeding light."],
 ["bloomGlass","Bloom into glass",0,1,.01,"0 = bloom only spills over the lead; 1 = also into neighbouring glass (muddies dark panes)."],
 ["streak","Streaks",0,2.5,.01,"Density swirls inside each pane."],
 ["relief","Hammered relief",0,14,.1,"Surface ripple: refraction and sparkle."],
 ["expo","Exposure",.5,4,.01,"Overall brightness."]];
function tuner(api){const P=api.params,box=document.createElement("div");box.id="tuner";
 box.innerHTML=`<h3>Window glass tuner</h3><div class="presets">${Object.keys(GL.PRESETS).map(k=>`<button data-p="${k}">${k}</button>`).join("")}</div>`+
  KNOBS.map(([k,l,mn,mx,st,help])=>`<label><span>${l}</span><output id="o-${k}"></output><input type="range" min="${mn}" max="${mx}" step="${st}" data-k="${k}"><small>${help}</small></label>`).join("")+
  `<button id="copy" style="margin-top:8px">Copy values</button>`;
 document.body.appendChild(box);
 const sync=()=>box.querySelectorAll("input").forEach(i=>{i.value=P[i.dataset.k];box.querySelector("#o-"+i.dataset.k).textContent=(+P[i.dataset.k]).toFixed(2)});
 box.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{api.set(i.dataset.k,+i.value);box.querySelector("#o-"+i.dataset.k).textContent=(+i.value).toFixed(2);box.querySelectorAll("[data-p]").forEach(b=>b.classList.remove("on"))}));
 box.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{Object.entries(GL.PRESETS[b.dataset.p]).forEach(([k,v])=>api.set(k,v));sync();box.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===b))}));
 box.querySelector("#copy").addEventListener("click",e=>{navigator.clipboard.writeText(JSON.stringify(P));e.target.textContent="Copied — paste it to Claude"});
 const pre=new URLSearchParams(location.search).get("preset")||"locked";box.querySelector(`[data-p="${pre}"]`)?.classList.add("on");sync()}
</script>
