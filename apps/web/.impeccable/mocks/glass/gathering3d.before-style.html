<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gathering — Apostasy: Sede Vacante</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600&family=Spectral:ital,wght@1,400;1,500&display=swap">
<style>
/* Fixed 390×844 composition for this mock; the shipped surface scales the scene to the device. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#050407;height:100%}
#stage{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:default}
#c{position:absolute;inset:0;width:390px;height:844px;display:block}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 46%,transparent 55%,rgba(5,4,7,var(--vig,.13)) 100%)}
/* The two fittings are objects in the scene; these are their touch and keyboard handles. */
.fit{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;background:none;border:0;border-radius:50%;cursor:pointer}
.fit:focus-visible{outline:1px solid rgba(176,141,82,.6);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style></head>
<body>
<div id="stage">
 <canvas id="c"></canvas><div class="vign"></div>
 <button class="fit" id="ring" aria-label="Leave the Gathering"></button>
 <button class="fit" id="hour" aria-label="Pass to the outcome (hold: always pass)"></button>
 <p class="sr" id="say" aria-live="polite"></p>
</div>
<script src="../vendor/three.iife.js"></script>
<script src="glass.js"></script><script src="glassgl.js"></script><script src="masks.js"></script>
<script>
(async () => {
const T = THREE, $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Q = new URLSearchParams(location.search);
const SW = 390, SH = 844, DPR = Math.min(devicePixelRatio || 1, 2);

// Owner-tuned 2026-10-15 in the 2D Gathering. In this scene: inward pulls both projections toward the
// centre, zc is where they land (high = by the wall), spread is how far back the light stands, caus is
// filament strength, expo is the exposure, vig the edge darkening. Pool depth (rz) is now set by geometry.
const LOOK = { inward: .17, zc: 2.75, rz: 1.18, spread: .8, caus: .34, expo: 1.15, vig: .13 };

/* ---------- The Meeting, as settled on-chain ---------- */
const OPP = { name: "Old Marrow", aspect: "madness", Aspect: "Madness" }, YOU = { name: "Vesper", aspect: "echo", Aspect: "Echo" };
const TURNS = [["K", "K"], ["K", "D"], ["D", "D"], ["D", "K"], ["K", "K"]]; // [Vesper, Old Marrow]
const PAY = { KK: [3, 3], KD: [0, 5], DK: [5, 0], DD: [1, 1] };
const SAY = { KK: ["Both kindle", "Their light runs together on the stone.", "Three lights each."], KD: ["Old Marrow devours", "Vesper's light is drawn across the floor.", "Marrow takes five."],
	DK: ["Vesper devours", "Echo answers what it was given.", "Vesper takes five."], DD: ["Both devour", "Each takes, and the light gutters between them.", "One light each."] };
const WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty", "twenty-one", "twenty-two", "twenty-three", "twenty-four", "twenty-five"];
function outcome() {
	let y = 0, o = 0, yd = 0, od = 0;
	for (const [a, b] of TURNS) { const [p, q] = PAY[a + b]; y += p; o += q; if (a === "D") yd++; if (b === "D") od++; }
	const times = (n) => n === 1 ? "once" : n === 2 ? "twice" : `${WORDS[n]} times`;
	const h = y > o ? `${YOU.name} outshone ${OPP.name}` : y < o ? `${OPP.name} drew more light` : "An even Gathering";
	return { y, o, h, a: `${YOU.name} gathered ${WORDS[y]} Light, ${OPP.name} ${WORDS[o]}.`, b: `${OPP.name} devoured ${od ? times(od) : "never"}; ${YOU.Aspect} ${yd ? "answered " + times(yd) : "never devoured"}.`, c: "Third of twenty-four tonight. Vesper's resonance deepens." };
}

/* ---------- Renderer: one WebGL context for everything ---------- */
const canvas = $("#c");

R.toneMappingExposure = LOOK.expo;

const scene = new T.Scene();

const cam = new T.PerspectiveCamera(60, SW / SH, .1, 40);
const CAM = { pos: new T.Vector3(0, 3.4, 5.8), at: new T.Vector3(0, .9, 1.2) };
const CAM_END = { pos: new T.Vector3(0, 3.55, 5.35), at: new T.Vector3(0, .5, 1.95) };
// Review only: ?top looks straight down at the floor to check the projections.
if (Q.has("top")) { CAM.pos.set(0, 6.5, 1.75); CAM.at.set(0, 0, 1.7); CAM_END.pos.copy(CAM.pos); CAM_END.at.copy(CAM.at); }
cam.position.copy(CAM.pos); cam.lookAt(CAM.at);

/* ---------- Geometry of the wall ---------- */
const WIN = { w: 1, h: 1.4, rect: .9, r: .5, sill: 1.3, glassZ: -.395 };
const YC = WIN.sill + WIN.h / 2;
const SIDES = { opp: { wx: -.62, data: OPP, theme: "marrow", seed: 23 }, you: { wx: .62, data: YOU, theme: "vesper", seed: 13 } };

/* ---------- Procedural stone: generated, Kuwahara-painted once, lit live through its normals ---------- */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

		for (const [qx, qy] of [[cx - r, cy - r], [cx, cy - r], [cx - r, cy], [cx, cy]]) {

			edge = Math.min(ly, 127 - ly, lx, 127 - lx);

			base = [96, 88, 84];
		}

		const joint = kind === "ashlar" ? 1.4 : .9;

		let k = (.8 + (cell - .5) * .26) * (.8 + .45 * big) * (.9 + .2 * mid);
		if (kind !== "ashlar") { const vein = Math.abs(Math.sin((u * 3 + v * 1.4) * Math.PI * 4 + mid * 9)); k *= .93 + .16 * Math.pow(1 - vein, 14); }
		k *= (kind === "ashlar" ? .7 : .8) + (kind === "ashlar" ? .3 : .2) * groove;

const ASHLAR = stone({ seed: 0x80aa973e, kind: "ashlar" }), FLAGS = stone({ seed: 0x973e80aa, kind: "flags" });
ASHLAR.map.repeat.set(1 / 2.9, 1 / 2.9); ASHLAR.nrm.repeat.set(1 / 2.9, 1 / 2.9);
FLAGS.map.repeat.set(1 / 3.2, 1 / 3.2); FLAGS.nrm.repeat.set(1 / 3.2, 1 / 3.2);

/* ---------- The wall: glass near the outer face, a splayed embrasure opening toward the room ---------- */
// Like a cathedral lancet: jambs widen inward and the sill slopes down, so the light reaches the floor and
// rakes the reveals on its way. BACK is the glazed opening; FRONT is where the embrasure meets the room.
const BACK = { half: WIN.w / 2 - .02, sill: WIN.sill + .02, spring: WIN.sill + WIN.rect, r: WIN.r - .02, z: -.37 };
const FRONT = { half: .56, sill: .93, spring: WIN.sill + WIN.rect + .1, r: .56, z: 0 };
const SEG = { jamb: 10, arc: 36, sill: 10 };
function outline(cx, o) {

	for (let i = 0; i < SEG.jamb; i++) pts.push([x0, o.sill + ((o.spring - o.sill) * i) / SEG.jamb]);
	for (let i = 0; i < SEG.arc; i++) { const a = Math.PI - (Math.PI * i) / SEG.arc; pts.push([cx + Math.cos(a) * o.half, o.spring + Math.sin(a) * o.r]); }
	for (let i = 0; i < SEG.jamb; i++) pts.push([x1, o.spring - ((o.spring - o.sill) * i) / SEG.jamb]);
	for (let i = 0; i < SEG.sill; i++) pts.push([x1 - ((x1 - x0) * i) / SEG.sill, o.sill]);
	return pts;
}
const holePath = (pts) => { const p = new T.Path(); p.moveTo(...pts[0]); for (const q of pts.slice(1)) p.lineTo(...q); p.closePath(); return p; };
const wallRect = () => { const s = new T.Shape(); s.moveTo(-3.4, 0); s.lineTo(3.4, 0); s.lineTo(3.4, 5); s.lineTo(-3.4, 5); s.closePath(); return s; };
const frontShape = wallRect(), backShape = wallRect();
for (const s of Object.values(SIDES)) { frontShape.holes.push(holePath(outline(s.wx, FRONT))); backShape.holes.push(holePath(outline(s.wx, BACK))); }
// The reveals: a loft from the glazed outline to the room outline, faces turned into the opening.

	let run = 0;

		const j = (i + 1) % n, step = Math.hypot(f[j][0] - f[i][0], f[j][1] - f[i][1]);
		const B0 = [b[i][0], b[i][1], BACK.z], B1 = [b[j][0], b[j][1], BACK.z], F0 = [f[i][0], f[i][1], FRONT.z], F1 = [f[j][0], f[j][1], FRONT.z];
		const u0 = run, u1 = run + step, vb = 0, vf = .45; run = u1;
		pos.push(...B0, ...F0, ...B1, ...B1, ...F0, ...F1);
		uv.push(u0, vb, u0, vf, u1, vb, u1, vb, u0, vf, u1, vf);
	}

	g.setAttribute("position", new T.Float32BufferAttribute(pos, 3)); g.setAttribute("uv", new T.Float32BufferAttribute(uv, 2));
	g.computeVertexNormals();

	const sillNy = g.attributes.normal.getY((SEG.jamb * 2 + SEG.arc + 2) * 6);
	if (sillNy < 0) { const p = g.attributes.position; for (let k = 0; k < p.count; k += 3) { const t = [p.getX(k + 1), p.getY(k + 1), p.getZ(k + 1)]; p.setXYZ(k + 1, p.getX(k + 2), p.getY(k + 2), p.getZ(k + 2)); p.setXYZ(k + 2, ...t); } const u = g.attributes.uv; for (let k = 0; k < u.count; k += 3) { const t = [u.getX(k + 1), u.getY(k + 1)]; u.setXY(k + 1, u.getX(k + 2), u.getY(k + 2)); u.setXY(k + 2, ...t); } g.computeVertexNormals(); }
	return g;
}
const stoneMat = new T.MeshStandardMaterial({ map: ASHLAR.map, normalMap: ASHLAR.nrm, normalScale: new T.Vector2(1, 1), roughness: .93, color: 0xffffff, shadowSide: T.DoubleSide });
const wallParts = [new T.ShapeGeometry(frontShape, 1), (() => { const g = new T.ExtrudeGeometry(backShape, { depth: .05, bevelEnabled: false }); g.translate(0, 0, BACK.z - .05); return g; })(), embrasure(SIDES.opp.wx), embrasure(SIDES.you.wx)];
const wall = new T.Group();
for (const g of wallParts) { const m = new T.Mesh(g, stoneMat); m.castShadow = m.receiveShadow = true; wall.add(m); }
scene.add(wall);
// Colonnette between the windows, with base and capital; stringcourse under the sills; hood mouldings.
const trimMat = new T.MeshStandardMaterial({ map: ASHLAR.map, normalMap: ASHLAR.nrm, roughness: .88, color: 0xd8d0c8, shadowSide: T.DoubleSide });
function add(geo, mat, x, y, z, shadow = true) { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; scene.add(m); return m; }
add(new T.CylinderGeometry(.042, .046, FRONT.spring, 20), trimMat, 0, FRONT.spring / 2, .05);
add(new T.BoxGeometry(.15, .07, .13), trimMat, 0, FRONT.spring + .035, .05);
add(new T.BoxGeometry(.14, .1, .12), trimMat, 0, .05, .05);
add(new T.BoxGeometry(6.8, .075, .11), trimMat, 0, FRONT.sill - .035, .055);
add(new T.BoxGeometry(6.8, .05, .07), trimMat, 0, FRONT.sill - .1, .035);
// Each hood runs from the outer sill, over the arch, down to meet its twin above the capital.
const HOOD_R = FRONT.half + .15;

	pts.push(new T.Vector3(s.wx + out * HOOD_R, FRONT.sill + .02, .02));
	for (let k = 0; k <= 28; k++) { const a = (Math.PI - end) * (k / 28); const ang = out < 0 ? Math.PI - a : a; pts.push(new T.Vector3(s.wx + Math.cos(ang) * HOOD_R, FRONT.spring + Math.sin(ang) * HOOD_R, .02)); }

// Floor
const floorMat = new T.MeshStandardMaterial({ map: FLAGS.map, normalMap: FLAGS.nrm, normalScale: new T.Vector2(.5, .5), roughness: .84, color: 0xffffff });

/* ---------- Windows: the locked glass shader, with the Aspect mask painted into the glass ---------- */
const GW = 320, GH = 448;
const MASK_EYES = { mercy: [[34, 39], [66, 39]], hunger: [[34, 34], [66, 34]], echo: [[31, 38], [69, 38]], rancour: [[31, 35], [69, 35]], appetite: [[32, 37], [68, 37]], inquisitor: [[33, 27], [67, 27]], madness: [[34, 42], [68, 44]] };

const MASK_BOX = [105.4 / 300, 202.7 / 420, 89.2 / 300, 75 / 420];
const eyeUV = (aspect) => MASK_EYES[aspect].map(([x, y]) => [MASK_BOX[0] + (x / 100) * MASK_BOX[2], MASK_BOX[1] + (y / 84) * MASK_BOX[3]]);

		w.u.uT.value = t; w.u.uSwell.value = sw; w.u.uDim.value = c.dim; w.u.uRed.value = c.red; w.u.uCrack.value = c.crack;
		w.u.uEyeGlow.value = eyeGlowAt(k, t) * (1 - c.dim * .5);
		w.u.uLook.value.multiplyScalar(reduce ? 0 : Math.exp(-dt * .7));
		// The floor throws a little of that light back onto the wall.
		w.bounce.position.set(c.x, .22, c.z); w.bounce.intensity = 1.4 * c.i * (1 - c.dim * .6);
		w.emit.intensity = 1.6 * c.i * (1 - c.dim * .6); w.emit.color.copy(w.emitBase || (w.emitBase = w.emit.color.clone())).lerp(new T.Color(1, .1, .12), c.red * .45);
		w.bounce.color.copy(new T.Color(1, .82, .62)).lerp(new T.Color(1, .12, .14), c.red * .8);
		// Medallions: lit ones hold their glow; the crawling light runs ahead of the next to fill.
		if (w.crawlTo >= 0) { w.crawl = reduce ? w.crawlTo : Math.min(w.crawlTo, w.crawl + dt * 14 * speed); while (w.lit < Math.floor(w.crawl) + 1 && w.lit <= w.crawlTo) w.lit++; }
		w.medals.forEach((md, j) => {
			const on = j < w.lit ? (w.weak[j] ? .22 : .5) : 0, head = w.crawl < w.crawlTo - .01 ? Math.exp(-((j - w.crawl) ** 2) * 1.2) * .9 : 0;
			md.material.emissiveIntensity = ease(md.material.emissiveIntensity, on + head, 9, dt);
		});
	}
	eye = ease(eye, eyeTg, 3, dt); eyeMat.emissiveIntensity = eye * .5; eyeLight.intensity = eye * 1.5;
	txtA = ease(txtA, txtTg, 3, dt); turnText.material.opacity = txtA;
	endA = ease(endA, endTg, 1.6, dt); endText.material.opacity = endA;
	camBlend = ease(camBlend, camBlendTg, 1.1, dt);
	par.x = ease(par.x, par.tx, 6, dt); par.y = ease(par.y, par.ty, 6, dt);
	cam.position.lerpVectors(CAM.pos, CAM_END.pos, camBlend).add(new T.Vector3(par.x * .45, par.y * .25, 0));
	const at = new T.Vector3().lerpVectors(CAM.at, CAM_END.at, camBlend); cam.lookAt(at);
	ringPivot.rotation.z = ring.userData.swing ? ring.userData.swing(t) : 0;
	hourglass.rotation.z = ease(hourglass.rotation.z, fast() ? Math.PI / 2 : 0, 6, dt);
	hourglass.position.y = Math.abs(Math.sin(hourglass.rotation.z)) * .075;
	R.toneMappingExposure = LOOK.expo;
	for (const k of ["opp", "you"]) { mapScene.children.forEach((q) => (q.visible = q === W[k].quad)); R.setRenderTarget(W[k].rt); R.render(mapScene, mapCam); }
	R.setRenderTarget(null);
	R.render(scene, cam);
	placeFittings();
	if (running) requestAnimationFrame(frame);
}
let running = true;
document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running) { clock.prev = performance.now(); requestAnimationFrame(frame); } });
function placeFittings() {
	for (const [el, obj] of [[$("#ring"), ring], [$("#hour"), hourglass]]) {
		const v = obj.getWorldPosition(new T.Vector3()).project(cam);
		el.style.left = ((v.x + 1) / 2) * SW + "px"; el.style.top = ((1 - v.y) / 2) * SH + "px";
	}
}
$(".vign").style.setProperty("--vig", Math.min(.9, LOOK.vig * 4.5));

/* ---------- The rite ---------- */
let hurry = false, skipped = false, gen = 0, over = false;
function wait(ms) { return new Promise((res) => { let acc = 0, prev = performance.now(); (function f() { if (skipped) return res(); if (hurry) { hurry = false; return res(); } const n = performance.now(); acc += (n - prev) * speed; prev = n; acc >= ms ? res() : setTimeout(f, 16); })(); }); }
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const fast = () => localStorage.getItem("apostasy.skipAnimations") === "1";
function fill(k, n, weak) {
	const w = W[k];
	for (let j = w.lit; j < Math.min(MEDAL_N, w.lit + n); j++) w.weak[j] = weak;
	w.crawl = Math.max(w.crawl, w.lit - 1); w.crawlTo = Math.min(MEDAL_N - 1, Math.max(w.crawlTo, w.lit + n - 1));
	if (n === 0) return;
}
function setLit(k, n, weakSet) { const w = W[k]; w.lit = n; w.crawl = n - 1; w.crawlTo = n - 1; w.weak = weakSet || []; }
function settleAll() { for (const k of ["opp", "you"]) home(k); eyeTg = 0; txtTg = 0; }
async function turn(i, my) {
	const [y, o] = TURNS[i], key = y + o, [py, po] = PAY[key];
	// 1. Hush: a cloud crosses behind both windows; the words of the last turn are already dark.
	for (const k of ["opp", "you"]) { W[k].tg.i = .55; W[k].tg.dim = .55; }
	writeTurn(key);
	await wait(620); if (my !== gen) return;
	// 2. Reveal: each light answers. Kindle surges warm; devour turns the glass crimson.
	for (const [k, c] of [["you", y], ["opp", o]]) {
		const w = W[k]; w.tg.dim = 0; w.tg.i = 1;
		if (c === "K") { w.swellT = clock.t; w.tg.i = 1.3; w.tg.swell = 1; } else { w.tg.red = 1; w.tg.i = 1.15; }
	}
	buzz(12); await wait(600); if (my !== gen) return;
	// 3. Exchange: the lights move, and the words in the floor come up where they fall.
	const vz = homeZ() + .12;
	if (key === "KK") { for (const k of ["opp", "you"]) Object.assign(W[k].tg, { x: Math.sign(SIDES[k].wx) * .14, z: vz, i: 1.05, interf: 1 }); }
	if (key === "KD") { Object.assign(W.opp.tg, { x: homeX("you") * .35, z: vz + .15, i: 1.5, red: 1 }); Object.assign(W.you.tg, { i: .28, dim: .7 }); W.you.tg.crack = Math.min(1, W.you.tg.crack + .5); eyeTg = 1; buzz([30, 40, 60]); }
	if (key === "DK") { Object.assign(W.you.tg, { x: homeX("opp") * .35, z: vz + .15, i: 1.5, red: 1 }); Object.assign(W.opp.tg, { i: .28, dim: .7 }); W.opp.tg.crack = Math.min(1, W.opp.tg.crack + .5); eyeTg = 1; buzz([30, 40, 60]); }
	if (key === "DD") { for (const k of ["opp", "you"]) Object.assign(W[k].tg, { i: .6, red: .7, dim: .35 }); eyeTg = .6; buzz(40); }
	txtTg = 1;
	$("#say").textContent = SAY[key].join(" ");
	await wait(1100); if (my !== gen) return;
	// 4. Tally: light crawls along each arch, filling medallions.
	fill("you", py, key === "DD"); await wait(150); fill("opp", po, key === "DD");
	await wait(520 + Math.max(py, po) * 90); if (my !== gen) return;
	if (Q.has("still")) return new Promise(() => {});
	// 5. Settle
	settleAll(); for (const k of ["opp", "you"]) W[k].tg.i = .85;
	await wait(700); if (my !== gen) return;
}
function finish() {
	skipped = true; gen++; over = true;
	const r = outcome();
	const weakFor = (side) => { const ws = []; for (const [a, b] of TURNS) { const n = PAY[a + b][side]; for (let k = 0; k < n; k++) ws.push(a + b === "DD"); } return ws; };
	setLit("you", r.y, weakFor(0)); setLit("opp", r.o, weakFor(1));
	for (const k of ["opp", "you"]) { home(k, 1.15); W[k].tg.crack = Math.min(1, .5 * TURNS.filter((tt) => tt.join("") === (k === "you" ? "KD" : "DK")).length); }
	// Both lights come forward to lay the verdict open on the floor.
	W.opp.tg.x = -.42; W.you.tg.x = .42; W.opp.tg.z = W.you.tg.z = 2.35;
	txtTg = 0; eyeTg = .35; writeEnd(); endTg = 1; camBlendTg = 1;
}
async function play() {
	const my = ++gen; skipped = false; over = false; endTg = 0; camBlendTg = 0;
	$("#say").textContent = "";
	setLit("you", 0); setLit("opp", 0);
	for (const k of ["opp", "you"]) { home(k); W[k].tg.crack = 0; }
	const from = Math.min(TURNS.length - 1, +(Q.get("from") || 0));
	for (let i = 0; i < from; i++) {
		const [a, b] = TURNS[i], [p, q] = PAY[a + b];
		fill("you", p, a + b === "DD"); fill("opp", q, a + b === "DD"); W.you.lit = W.you.crawlTo + 1; W.opp.lit = W.opp.crawlTo + 1;
		if (a + b === "KD") W.you.tg.crack = Math.min(1, W.you.tg.crack + .5);
		if (a + b === "DK") W.opp.tg.crack = Math.min(1, W.opp.tg.crack + .5);
	}
	for (const k of ["opp", "you"]) W[k].crawl = W[k].crawlTo;
	await wait(500);
	for (let i = from; i < TURNS.length; i++) { if (skipped || my !== gen) return; await turn(i, my); }
	if (my === gen && !Q.has("still")) finish();
}

/* ---------- Touch ---------- */
const ray = new T.Raycaster(), ndc = new T.Vector2();
const glasses = () => [W.opp.glass, W.you.glass];
let holdT = null, down = null;
function pick(e) {
	const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
	ray.setFromCamera(ndc, cam);
	return ray.intersectObjects([...glasses(), floor], false)[0];
}
function lookAt(hit) {
	const w = W.opp.glass === hit.object ? W.opp : W.you, e = w.u.uEyes.value;
	const uvp = new T.Vector2(hit.uv.x, 1 - hit.uv.y), c = new T.Vector2((e.x + e.z) / 2, (e.y + e.w) / 2);
	const d = uvp.sub(c); const l = d.length() || 1;
	w.u.uLook.value.copy(d.multiplyScalar(.0045 / l * Math.min(1, l * 6)));
	w.lookT = clock.t;
}
function placeFinger(hit) {
	// The finger hovers between the stone and the light, so its shadow falls where you touch.
	const toL = W[hit.point.x < 0 ? "opp" : "you"].spot.position.clone().sub(hit.point).normalize();
	finger.position.copy(hit.point).addScaledVector(toL, .42);
	finger.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), cam.position.clone().sub(finger.position).normalize().lerp(new T.Vector3(0, 1, 0), .3).normalize());
	finger.visible = true;
}
$("#stage").addEventListener("pointerdown", (e) => {
	if (e.target.closest(".fit")) return;
	if (over) { play(); return; }
	const hit = pick(e);
	down = { x: e.clientX, y: e.clientY, moved: false };
	if (hit && hit.object !== floor) { lookAt(hit); return; }
	if (hit) placeFinger(hit);
	hurry = true;
	holdT = setTimeout(() => { speed = 3; rushing = true; }, 220);
});
$("#stage").addEventListener("pointermove", (e) => {
	if (!down) return;
	const dx = e.clientX - down.x, dy = e.clientY - down.y;
	if (Math.hypot(dx, dy) > 6) down.moved = true;
	if (!reduce) { par.tx = Math.max(-1, Math.min(1, -dx / 160)); par.ty = Math.max(-1, Math.min(1, dy / 200)); }
	if (finger.visible) { const hit = pick(e); if (hit && hit.object === floor) placeFinger(hit); }
});
["pointerup", "pointercancel", "pointerleave"].forEach((n) => $("#stage").addEventListener(n, () => { clearTimeout(holdT); speed = 1; rushing = false; down = null; par.tx = par.ty = 0; finger.visible = false; }));
// Ring: it swings when touched. Hourglass: tap passes to the outcome; hold lays it on its side (always pass).
$("#ring").addEventListener("click", () => { const t0 = clock.t; ring.userData.swing = (t) => reduce ? 0 : Math.sin((t - t0) * 9) * .35 * Math.exp(-(t - t0) * 2.2); });
let hourHold = null, hourHeld = false;
$("#hour").addEventListener("pointerdown", () => { hourHeld = false; hourHold = setTimeout(() => { hourHeld = true; localStorage.setItem("apostasy.skipAnimations", fast() ? "0" : "1"); $("#hour").setAttribute("aria-pressed", String(fast())); if (fast() && !over) finish(); }, 650); });
["pointerup", "pointerleave", "pointercancel"].forEach((n) => $("#hour").addEventListener(n, () => clearTimeout(hourHold)));
$("#hour").addEventListener("click", () => { if (!hourHeld && !over) finish(); });
$("#hour").setAttribute("aria-pressed", String(fast()));

/* ---------- Owner tuning (?tune) ---------- */
if (Q.has("tune")) {
	const K = [["inward", "Pull toward centre", 0, 1, .01], ["zc", "Where it lands (high = by the wall)", 1.2, 3.9, .01], ["spread", "Source distance (lower = farther)", .3, 1.5, .01], ["caus", "Filament strength", 0, 1.5, .01], ["expo", "Scene brightness", .4, 1.8, .01], ["vig", "Vignette", 0, 1, .01]];
	const box = document.createElement("div");
	box.style.cssText = "position:fixed;top:16px;left:calc(50% + 215px);width:260px;background:#f4f1ea;color:#1d1b19;border-radius:12px;padding:14px 16px;font:500 13px/1.4 system-ui,sans-serif;z-index:50;user-select:text";
	box.innerHTML = "<b>Gathering light tuner</b>" + K.map(([k, l, a, b, st]) => `<label style="display:block;margin:8px 0">${l} <output id="o-${k}" style="float:right">${LOOK[k].toFixed(2)}</output><input style="width:100%" type="range" min="${a}" max="${b}" step="${st}" value="${LOOK[k]}" data-k="${k}"></label>`).join("") + '<button id="copy">Copy values</button>';
	document.body.appendChild(box);
	box.querySelectorAll("input").forEach((i) => i.addEventListener("input", () => { LOOK[i.dataset.k] = +i.value; box.querySelector("#o-" + i.dataset.k).textContent = (+i.value).toFixed(2); if (!over) for (const k of ["opp", "you"]) { W[k].tg.x = homeX(k); W[k].tg.z = homeZ(); } $(".vign").style.setProperty("--vig", Math.min(.9, LOOK.vig * 4.5)); }));
	box.querySelector("#copy").addEventListener("click", (e) => { navigator.clipboard.writeText(JSON.stringify(LOOK)); e.target.textContent = "Copied: paste it to Claude"; });
}

requestAnimationFrame(frame);
if (Q.has("end")) finish();
else setTimeout(() => (fast() ? finish() : play()), reduce ? 0 : 700);
})();
</script>
</body></html>
