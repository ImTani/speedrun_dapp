packages:
  - apps/*
  - packages/*

# Only dependencies listed here may run install scripts (pnpm blocks the rest by default).
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  keccak: false
  utf-8-validate: false

minimumReleaseAgeExclude:
  - framer-motion@14.4.0
  - motion-dom@14.4.0
  - motion@14.4.0
